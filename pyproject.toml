[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfce-purchase-analyzer"
version = "0.1.0"
description = "Local-first desktop analyzer for NFC-e purchase PDFs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
